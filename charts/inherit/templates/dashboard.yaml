{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inherit.fullname" . }}-dashboard
  labels:
    {{- include "inherit.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  inherit.json: |-
    {{- .Files.Get "dashboards/inherit.json" | nindent 4 }}
{{- end }}