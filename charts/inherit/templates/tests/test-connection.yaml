apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "inherit.fullname" . }}-test-connection"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command: ["sh", "-c"]
      args:
        - >-
          curl -fsS --retry 5 --retry-connrefused http://{{ include "inherit.fullname" . }}:{{ .Values.service.port }}/api/health
          | grep '"version":"{{ .Values.image.tag }}"'